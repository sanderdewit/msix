name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      # Parse every PowerShell source file first. PSScriptAnalyzer is run at
      # Error,Warning severity below, but parse errors surface as ParseError
      # severity and are NOT caught by that filter — so a syntactically broken
      # module can pass lint and only blow up when Pester dot-sources it. This
      # step (no module install required) fails fast and points at the exact
      # file/line. See the #56 regression that motivated it.
      - name: Parse-check PowerShell sources
        shell: pwsh
        run: |
          $bad = $false
          Get-ChildItem -Path . -Recurse -Include *.ps1, *.psm1, *.psd1 |
            Where-Object { $_.FullName -notmatch '\\\.git\\' } |
            ForEach-Object {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors) {
                $bad = $true
                Write-Host "::error file=$($_.FullName)::$($errors.Count) parse error(s)"
                $errors | ForEach-Object {
                  Write-Host "  $($_.Extent.StartLineNumber):$($_.Extent.StartColumnNumber) $($_.Message)"
                }
              }
            }
          if ($bad) { throw 'Parse errors found in PowerShell sources.' }
          Write-Host 'All PowerShell sources parsed cleanly.'

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -SkipPublisherCheck

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity ParseError, Error, Warning
          if ($results) {
            $results | Format-Table -AutoSize
            throw "PSScriptAnalyzer found $($results.Count) issue(s)."
          }
          Write-Host "No issues found."

      - name: Validate module manifest
        shell: pwsh
        run: Test-ModuleManifest -Path MSIX.psd1

  test:
    name: Pester Tests
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -SkipPublisherCheck -MinimumVersion 5.0

      # Provision the toolchain here too, not just in the integration lane.
      # Without it this lane fell through to the runner's system Windows SDK,
      # which has no PSF - so 10 PSF-dependent tests skipped, including the
      # Add-MsixPsfV2 re-injection guard for the OrderedDictionary.ContainsKey
      # crash (#138) and the Remove-MsixPsf round-trip covering the #145
      # data-loss fix. A skipped guard protects nothing.
      #
      # Uses the module's own one-call setup, so the installer path is exercised
      # end to end. Procmon/DebugView/MsixMgr/Runtime are SKIPPED deliberately:
      #   * no test needs them - they are in the environment-bound exclusion list
      #     because they require a kernel driver, Hyper-V, or a live install;
      #   * they add four more download endpoints (Sysinternals, aka.ms
      #     redirectors) to every build. The Procmon extract fails intermittently
      #     even locally, so including it would make CI flaky for no coverage;
      #   * msixmgr additionally carries a documented Authenticode exception
      #     (upstream signing is broken, microsoft/msix-packaging#710) that has
      #     no business being exercised on every push.
      # Failure is FATAL: a toolchain we could not provision must fail the build
      # rather than silently reduce coverage (#151).
      - name: Provision toolchain (SDK + PSF)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./MSIX.psd1 -Force
          Initialize-MsixToolchain -Skip Procmon,DebugView,MsixMgr,Runtime | Out-Null
          $root = & (Get-Module MSIX) { Get-MsixToolsRoot }
          "Tools root: $root"
          foreach ($probe in @('Tools\MakeAppx.exe', 'psf\PsfLauncher64.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $probe))) {
              throw "Provisioning incomplete: $probe is missing under '$root'."
            }
            "  present: $probe"
          }

      - name: Run Pester tests (with code coverage)
        shell: pwsh
        run: |
          $testPath = if (Test-Path ./MSIX.Tests -PathType Container) { './MSIX.Tests' }
                      elseif (Test-Path ./tests -PathType Container) { './tests' }
                      else { $null }
          if (-not $testPath) { throw "No test directory found (expected MSIX.Tests/ or tests/)." }

          $cfg = New-PesterConfiguration
          $cfg.Run.Path      = $testPath
          $cfg.Run.PassThru  = $true
          # Code coverage (issue #152): the suite had NO coverage measurement at
          # all, which is how 73 of 195 exported functions came to be never
          # invoked while the contract test reported zero debt. Measured, not
          # gated - the floor below is on test outcomes; coverage is reported so
          # a drop is visible in the job summary.
          $cfg.CodeCoverage.Enabled              = $true
          $cfg.CodeCoverage.Path                 = (Get-ChildItem -Path . -Filter 'MSIX.*.ps1' -File |
                                                    Where-Object { $_.Name -notlike '*.Tests.ps1' }).FullName
          $cfg.CodeCoverage.OutputFormat         = 'JaCoCo'
          $cfg.CodeCoverage.OutputPath           = 'coverage.xml'
          $cfg.CodeCoverage.CoveragePercentTarget = 60

          $r = Invoke-Pester -Configuration $cfg

          if ($r.CodeCoverage) {
            $pct = [math]::Round($r.CodeCoverage.CoveragePercent, 2)
            "Code coverage: $pct% ($($r.CodeCoverage.CommandsExecutedCount)/$($r.CodeCoverage.CommandsAnalyzedCount) commands)"
            "### Code coverage: $pct%" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) test(s) failed." }

      - name: Upload coverage report
        if: always()
        # v5 runs on Node 24; v4 targets the deprecated Node 20 and was being
        # force-migrated by the runner with a warning on every build.
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  compat-ps51:
    name: Windows PowerShell 5.1 compatibility
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      # The module declares PowerShellVersion 5.1, but every other job runs
      # under pwsh 7. PS7-only constructs that only fail at PARAMETER-BINDING
      # time under Windows PowerShell 5.1 — e.g. the ErrorMessage named arg on
      # [ValidatePattern]/[ValidateSet], added in PS 6.0 (issue #142) — parse
      # and bind fine under 7, so they sailed through CI and only broke on a
      # 5.1 host. This job runs under Windows PowerShell 5.1 (shell: powershell)
      # and forces every exported function's parameter attributes to be
      # instantiated via `Get-Command -Syntax`, which is exactly what trips the
      # "Property 'ErrorMessage' cannot be found" error — without having to
      # invoke each function with valid arguments.
      - name: Import module + instantiate all parameter attributes under 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          "Runner PowerShell: $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition))"
          Import-Module ./MSIX.psd1 -Force
          $cmds = Get-Command -Module MSIX -CommandType Function
          $fail = @()
          foreach ($c in $cmds) {
            try { $null = Get-Command $c.Name -Syntax }
            catch { $fail += "$($c.Name): $($_.Exception.Message.Split([char]10)[0])" }
          }
          "Checked $($cmds.Count) exported functions."
          if ($fail) {
            $fail | ForEach-Object { Write-Host "::error::$_" }
            throw "$($fail.Count) function(s) use PS7-only constructs that break under Windows PowerShell 5.1."
          }
          Write-Host 'All exported functions instantiate cleanly under Windows PowerShell 5.1.'

      # The -Syntax pass above catches PS7-only ATTRIBUTE properties, but not
      # PS7-only CMDLETS or PARAMETERS at call sites — that class shipped twice:
      # Join-String (PS6+) silently swapped a real scanner finding for an error
      # on 5.1, and Get-PfxCertificate -Password (PS6+) made two exported
      # functions unusable there (issue #146). PSScriptAnalyzer's
      # PSUseCompatibleCmdlets does NOT flag either. This resolves every command
      # and parameter name in the module against this 5.1 host's real cmdlet
      # metadata, so the whole class fails the build instead of a customer.
      - name: Resolve every command + parameter against real 5.1 metadata
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path . -Filter 'MSIX.*.ps1' -File |
                   Where-Object { $_.Name -notlike '*.Tests.ps1' }

          # Pass 1: collect every function the module defines anywhere, including
          # nested/local helpers. Those cannot be resolved with Get-Command here.
          $defined = New-Object 'System.Collections.Generic.HashSet[string]' ([StringComparer]::OrdinalIgnoreCase)
          $asts = @{}
          foreach ($f in $files) {
            $errors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            $asts[$f.Name] = $ast
            if ($errors) { continue }
            foreach ($fn in $ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true)) {
              # 'function script:_Foo' yields Name 'script:_Foo'; callers write '_Foo'.
              [void]$defined.Add(($fn.Name -replace '^(script|global|local|private):', ''))
            }
          }
          foreach ($f in $files) {
            foreach ($m in [regex]::Matches((Get-Content -LiteralPath $f.FullName -Raw), '(?m)^\s*Set-Alias\s+(?:-Name\s+)?([A-Za-z0-9_\-]+)')) {
              [void]$defined.Add($m.Groups[1].Value)
            }
          }

          # Provider DYNAMIC parameters: real on 5.1, absent from static metadata.
          $dynamicOk = @{ 'Set-ItemProperty' = @('Type'); 'New-ItemProperty' = @('Type'); 'Get-ChildItem' = @('Attributes') }

          $fail = @()
          foreach ($f in $files) {
            $ast = $asts[$f.Name]
            if (-not $ast) { continue }
            foreach ($call in $ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.CommandAst] }, $true)) {
              $name = $call.GetCommandName()
              if (-not $name) { continue }
              if ($defined.Contains($name)) { continue }
              $cmd = Get-Command -Name $name -ErrorAction SilentlyContinue
              if (-not $cmd) {
                $fail += "$($f.Name):$($call.Extent.StartLineNumber) command '$name' does not exist on Windows PowerShell 5.1"
                continue
              }
              if ($cmd.CommandType -notin 'Cmdlet','Function') { continue }
              $valid = @($cmd.Parameters.Keys) + @($cmd.Parameters.Values | ForEach-Object { $_.Aliases })
              foreach ($el in $call.CommandElements) {
                if ($el -isnot [System.Management.Automation.Language.CommandParameterAst]) { continue }
                $p = $el.ParameterName
                if ($dynamicOk.ContainsKey($cmd.Name) -and ($dynamicOk[$cmd.Name] -contains $p)) { continue }
                # Prefix matching: PowerShell accepts unambiguous abbreviations.
                if (-not ($valid | Where-Object { $_ -like "$p*" })) {
                  $fail += "$($f.Name):$($el.Extent.StartLineNumber) '$name -$p' is not a parameter on Windows PowerShell 5.1"
                }
              }
            }
          }
          "Scanned $($files.Count) module files; skipped $($defined.Count) module-defined names."
          if ($fail) {
            $fail | Sort-Object -Unique | ForEach-Object { Write-Host "::error::$_" }
            throw "$($fail.Count) PS7-only command/parameter use(s) found."
          }
          Write-Host 'Every command and parameter resolves on Windows PowerShell 5.1.'

  integration:
    name: Integration Tests (real MSIX)
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -SkipPublisherCheck -MinimumVersion 5.0

      # Build the toolchain the Integration-tagged tests need so they exercise
      # real pack/sign paths instead of skipping.
      #
      # Provisioning failure is now FATAL (issue #151). It used to be swallowed
      # into a "::warning::", which meant a NuGet/PSGallery outage produced a
      # GREEN build with ~96 integration tests silently skipped — the failure
      # mode looked identical to a passing run.
      #
      # PSF is provisioned too. It never was, so every PSF-dependent test
      # skipped in CI — including the Add-MsixPsfV2 re-injection regression
      # guard added for the OrderedDictionary.ContainsKey crash (#138) and the
      # Remove-MsixPsf round-trip that covers the #145 data-loss fix. Those
      # guards had never once run on a CI runner.
      - name: Provision toolchain (SDK + PSF)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./MSIX.psd1 -Force
          # Same one-call setup as the Pester lane, so both lanes provision
          # identically and the module's own entry point is exercised. See that
          # lane for why Procmon/DebugView/MsixMgr/Runtime are skipped.
          Initialize-MsixToolchain -Skip Procmon,DebugView,MsixMgr,Runtime | Out-Null
          $root = & (Get-Module MSIX) { Get-MsixToolsRoot }
          "Tools root: $root"
          foreach ($probe in @('Tools\MakeAppx.exe', 'psf\PsfLauncher64.exe')) {
            $p = Join-Path $root $probe
            if (-not (Test-Path -LiteralPath $p)) { throw "Provisioning incomplete: $p is missing." }
            "  present: $probe"
          }

      - name: Run integration tests
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path          = './MSIX.Tests'
          $cfg.Run.PassThru      = $true
          $cfg.Filter.Tag        = 'Integration'
          $cfg.Output.Verbosity  = 'Detailed'
          $r = Invoke-Pester -Configuration $cfg

          # Floor assertion (issue #151/#152): an all-skip run must be RED. Without
          # this, anything that quietly disables the tooling gate turns "ran no
          # integration coverage" into a passing build.
          # 100 pass locally with the full toolchain; an all-skip run lands near
          # zero, so this floor separates the two decisively without being brittle
          # about a handful of environment-dependent cases.
          $minimum = 85
          "Passed: $($r.PassedCount)  Failed: $($r.FailedCount)  Skipped: $($r.SkippedCount)"
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) integration test(s) failed." }
          if ($r.PassedCount -lt $minimum) {
            throw "Only $($r.PassedCount) integration tests passed (floor is $minimum). The toolchain gate is probably disabled - check the provisioning step and Test-MsixFixtureToolingAvailable."
          }
